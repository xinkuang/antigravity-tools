name: Fast Release (GHCR AMD64)
on:
  push:
    branches:
      - "main"
      - "dev"
      - "feature/*"
  workflow_dispatch:

jobs:
  docker-build-fast:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    # 只需要配置 ENABLE_DOCKER_PUSH 变量即可触发
    if: vars.ENABLE_DOCKER_PUSH == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (AMD64 Only)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/antigravity-manager:latest
            ghcr.io/${{ github.repository_owner }}/antigravity-manager:dev-latest
          build-args: |
            USE_MIRROR=false
